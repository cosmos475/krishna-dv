services:
  - type: web
    name: dev-pro-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app & python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMINS
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
